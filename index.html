<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Store</title>
    <link rel="icon" type="image/png" href="src/icons/logo_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #130a2a;
            --violet: #7c3aed;
            --pink: #ff4d8d;
            --amber: #ffb547;
            --text: #f6f2ff;
            --muted: #b9aedb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "Sora", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
            position: relative;
        }

        /* Luces de fondo animadas */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            animation: float 14s ease-in-out infinite alternate;
        }
        body::before {
            width: 520px; height: 520px;
            background: var(--violet);
            top: -140px; left: -120px;
            opacity: .6;
        }
        body::after {
            width: 460px; height: 460px;
            background: var(--pink);
            bottom: -140px; right: -100px;
            opacity: .45;
            animation-delay: -6s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(60px, 40px) scale(1.15); }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 22px clamp(20px, 5vw, 64px);
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -.02em;
            background: linear-gradient(90deg, var(--amber), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-links {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
        }

        header a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: .95rem;
            padding: 10px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .25);
            transition: transform .2s, background .2s, box-shadow .2s;
        }
        header a:hover {
            background: rgba(255, 255, 255, .12);
            transform: translateY(-2px);
        }
        header a:last-child {
            border: none;
            background: linear-gradient(90deg, var(--violet), var(--pink));
            box-shadow: 0 8px 24px rgba(255, 77, 141, .35);
        }
        header a:last-child:hover {
            box-shadow: 0 12px 32px rgba(255, 77, 141, .55);
        }
        header a:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 3px;
        }

        .container {
            max-width: 720px;
            margin: clamp(40px, 12vh, 120px) auto;
            padding: clamp(32px, 6vw, 64px);
            text-align: center;
            background: rgba(255, 255, 255, .07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .4);
            width: calc(100% - 40px);
            animation: enter .9s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(30px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }

        .container h2 {
            font-size: clamp(2rem, 6vw, 3.4rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -.03em;
            margin-bottom: 20px;
            background: linear-gradient(120deg, #fff 20%, var(--amber) 55%, var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .container p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--muted);
            max-width: 52ch;
            margin: 0 auto;
        }

        @media (prefers-reduced-motion: reduce) {
            body::before, body::after, .container { animation: none; }
        }

        @media (max-width: 520px) {
            header { justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Main Store</h1>

        <div class="auth-links">
            <a href="src/signin.html">Sign in</a>
            <a href="src/signup.html">Sign up</a>
        </div>
    </header>

    <div class="container">

        <h2>Welcome to Main Store</h2>

        <p>
            Please sign in if you already have an account or sign up to create a new one.
        </p>

    </div>

</body>

</html>
