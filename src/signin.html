<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h3>Login</h3>
    <form name="login_form" id="login_form" action="signin.php" method="POST">
        <label for="email">E-mail:</label><br>
        <input type="email" required name="email" id="email" placeholder="E-mail@gmail.com"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" required name="password" id="password" placeholder="Enter your password"><br><br>
        <button type="submit" id="login_button">Login</button>
    </form>
</body>
</html>
