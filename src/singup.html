<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Store - Register User</title>
        <link rel="icon" type="image/png" href="icons/logo_icon.png">
    </head>
    <body>
        <h3>Register User</h3>
        <label >First Name:</label><br>
        <input type="text" name="first_name" id="first_name" placeholder="Enter your first name"><br><br>
        
        <label >Last Name:</label><br>
        <input type="text" name="last_name" id="last_name" placeholder="Enter your last name"><br><br>

        <label >ID:</label><br>
        <input type="text" name="id" id="id" placeholder="Enter your ID"><br><br>

        <label >Mobile Number:</label><br>
        <input type="text" name="mobile_number" id="mobile_number" placeholder="Enter your mobile number"><br><br>

        <label >E-mail:</label><br>
        <input type="text" name="email" id="email" placeholder="Enter your email"><br><br>

        <label >Password:</label><br>
        <input type="text" name="password" id="password" placeholder="Enter your password"><br><br>
        <button type="submit" id="register_button">Register</button>
    </body>
</html>
