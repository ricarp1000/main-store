<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Store - Register User</title>
        <link rel="icon" type="image/png" href="icons/logo_icon.png">
    </head>
<body>

    <form name="register-form" action="signup.php" method="post">
        <h3>Registro de Usuario</h3>
        
        <div class="input-group">
            <label>Nombres</label>
            <input type="text" name="fname" required>
        </div>
        
        <div class="input-group">
            <label>Apellidos</label>
            <input type="text" name="lname" required>
        </div>
        
        <div class="input-group">
            <label>Número de identificación</label>
            <input type="text" name="idnumber" required>
        </div>
        
        <div class="input-group">
            <label>Teléfono (+57)</label>
            <input type="tel" name="mphone" required>
        </div>
        
        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" name="email" required>
        </div>
        
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" name="passw" required>
        </div>
        
        <button type="submit">Registrarse</button>
    </form>

</body>
</html>
