<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Store - Register User</title>
    <link rel="icon" type="image/png" href="src/icons/main_store_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #130a2a;
            --violet: #7c3aed;
            --pink: #ff4d8d;
            --amber: #ffb547;
            --text: #f6f2ff;
            --muted: #b9aedb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "Sora", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Luces de fondo animadas */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            animation: float 14s ease-in-out infinite alternate;
        }
        body::before {
            width: 520px; height: 520px;
            background: var(--violet);
            top: -140px; left: -120px;
            opacity: .6;
        }
        body::after {
            width: 460px; height: 460px;
            background: var(--pink);
            bottom: -140px; right: -100px;
            opacity: .45;
            animation-delay: -6s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(60px, 40px) scale(1.15); }
        }

        br { display: none; }

        /* Título del formulario */
        body > label {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -.03em;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(120deg, #fff 20%, var(--amber) 55%, var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Tarjeta del formulario */
        form {
            width: 100%;
            max-width: 460px;
            padding: clamp(28px, 5vw, 48px);
            background: rgba(255, 255, 255, .07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .4);
            display: flex;
            flex-direction: column;
            animation: enter .9s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(30px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }

        form label {
            font-size: .85rem;
            font-weight: 600;
            color: var(--muted);
            margin: 18px 0 8px;
        }
        form label:first-child { margin-top: 0; }

        input {
            width: 100%;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 16px;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input::placeholder { color: rgba(185, 174, 219, .6); }
        input:focus {
            border-color: var(--pink);
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 0 0 4px rgba(255, 77, 141, .25);
        }

        button {
            margin-top: 30px;
            padding: 15px 24px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, var(--violet), var(--pink));
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 77, 141, .35);
            transition: transform .2s, box-shadow .2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 77, 141, .55);
        }
        button:active { transform: translateY(0); }
        button:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            body::before, body::after, form { animation: none; }
        }
    </style>
</head>
<body>
    <label>Register User Form</label><br><br>
    <form  name="register-form" action="signup.php" method="post">
        <label>Firstname:</label><br>
        <input type="text" name="fname" placeholder="Nombre" required><br><br>
        <label>Lastname:</label><br>
        <input type="text" name="lname" placeholder="Apellido" required><br><br>
        <label>Identification Number:</label><br>
        <input type="text" name="idnumber" placeholder="Número de Identificación" required><br><br>
        <label>Mobile Phone:</label><br>
        <input type="text" name="mphone" placeholder="Número de Celular" required><br><br>
        <label>E-Mail:</label><br>
        <input type="email" name="email" placeholder="Correo Electrónico" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="pswd" placeholder="Contraseña" required><br><br>
        <button>Register:</button>
    </form>
</body>
</html>
