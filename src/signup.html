<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Main Store - Register User</title>
        <link rel="icon" type="image/png" href="icons/logo_icon.png">
    </head>
    <body>
        <h3>Register User</h3>
        <form name="register_form" id="register_form" action="signup.php" method="POST"> >
            <label >First Name:</label><br>
            <input type="text" name="Fname" required name="first_name" id="first_name" placeholder="Enter your first name"><br><br>
            <label >Last Name:</label><br>
            <input type="text" name="Lname" required name="last_name" id="last_name" placeholder="Enter your last name"><br><br>
            <label >ID:</label><br>
            <input type="text" name="idnumber" required name="id" id="id" placeholder="Enter your ID"><br><br>
            <label >Mobile Number:</label><br>
            <input type="text" name="Mphone" required name="mobile_number" id="mobile_number" placeholder="Enter your mobile number"><br><br>
            <label >E-mail:</label><br>
            <input type="email" name="E-mail" required name="E-mail" id="E-mail" placeholder="E-mail@gmail.com" ><br><br>
            <label >Password:</label><br>
            <input type="password" name="pswd" required name="password" id="password" placeholder="Enter your password"><br><br>
            <button type="submit" id="register_button">Register</button>
        </form>
    </body>
</html>
